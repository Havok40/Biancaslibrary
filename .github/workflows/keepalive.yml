# Keeps the library's free account service awake.
#
# A free Supabase project is paused after about a week with no database activity. If nobody opens
# the library for a week (a holiday), this asks it one small question twice a week so it never
# gets that far. The address and key below are the same public ones built into the page itself.
#
# This file is written by tools/publish.mjs from tools/keepalive.yml. Change it there, not here.
name: Keep the library's account awake

on:
  schedule:
    - cron: '17 5 * * 1,4' # Mondays and Thursdays, 05:17 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the account service a small question
        env:
          ACCOUNT_URL: https://jstttfipjctrtthtgygs.supabase.co
          ACCOUNT_KEY: sb_publishable_-YqMOtt-92ytv0FJoqCsxw_ZigWY6jX
        run: |
          # The newer keys (sb_publishable_…) go in the apikey header only; the older ones go in both.
          if [[ "$ACCOUNT_KEY" == sb_* ]]; then
            auth=()
          else
            auth=(-H "Authorization: Bearer $ACCOUNT_KEY")
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST "$ACCOUNT_URL/rest/v1/rpc/ping" \
            -H "apikey: $ACCOUNT_KEY" "${auth[@]}" \
            -H "Content-Type: application/json" -d '{}'
          echo

      # GitHub switches a schedule off after 60 days with no activity in the repository.
      # Switching it on again each run keeps it on.
      - name: Keep this schedule switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
